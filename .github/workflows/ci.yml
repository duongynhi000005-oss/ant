name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: make lint
      - run: make test

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            image: postgres:17
            port: "55432:5432"
            env: '{"POSTGRES_USER":"ant","POSTGRES_PASSWORD":"ant","POSTGRES_DB":"ant_test"}'
            health: pg_isready -U ant -d ant_test
          - database: mysql
            image: mysql:8.4
            port: "53306:3306"
            env: '{"MYSQL_ROOT_PASSWORD":"ant","MYSQL_USER":"ant","MYSQL_PASSWORD":"ant","MYSQL_DATABASE":"ant_test"}'
            health: mysql -uant -pant -h127.0.0.1 -e 'SELECT 1' ant_test
          - database: mariadb
            image: mariadb:11.8
            port: "53307:3306"
            env: '{"MARIADB_ROOT_PASSWORD":"ant","MARIADB_USER":"ant","MARIADB_PASSWORD":"ant","MARIADB_DATABASE":"ant_test"}'
            health: healthcheck.sh --connect --innodb_initialized
          - database: sqlserver
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: "51433:1433"
            env: '{"ACCEPT_EULA":"Y","MSSQL_SA_PASSWORD":"Ant_test_1!"}'
            health: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ant_test_1!' -Q 'SELECT 1'
    services:
      database:
        image: ${{ matrix.image }}
        env: ${{ fromJSON(matrix.env) }}
        ports:
          - ${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    env:
      ANT_TEST_DATABASES: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: go test -count=1 ./tests/...

  integration-sqlite:
    runs-on: ubuntu-latest
    env:
      ANT_TEST_DATABASES: sqlite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: go test -count=1 ./tests/...
